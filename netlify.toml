[build]
  # Vite outputs to 'dist/' by default
  publish = "dist"
  command = "npm run build"

# ── SPA Routing — Critical for React Router ───────────────────
# Without this rule, refreshing /tours or /admin would return a 404
# because Netlify looks for a real file at that path.
# This rule sends ALL requests to index.html and lets React Router
# handle the routing client-side.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
