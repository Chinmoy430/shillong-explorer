<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — SAWAIOM TRAVELS AGENCY</title>
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">🏔️</div>
      <h1>SAWAIOM TRAVELS AGENCY</h1>
      <p>Admin Panel — Secure Login</p>
    </div>

    <form class="login-form" id="login-form" autocomplete="off">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" class="form-input" id="username" placeholder="Enter username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-input" id="password" placeholder="Enter password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn" id="login-btn">Sign In →</button>
    </form>

    <div class="login-error" id="login-error">
      ❌ Invalid username or password. Please try again.
    </div>

    <div class="login-hint">
      Default credentials: <strong style="color:rgba(255,255,255,0.5);">admin</strong> / <strong style="color:rgba(255,255,255,0.5);">shillong2025</strong><br>
      <span style="font-size:0.7rem;margin-top:4px;display:block;">Change in Admin → Settings</span>
    </div>

    <div style="margin-top:20px;text-align:center;">
      <a href="../index.html" style="font-size:0.78rem;color:rgba(255,255,255,0.3);text-decoration:underline;">← Back to Website</a>
    </div>
  </div>

<script src="../js/data.js"></script>
<script src="../js/auth.js"></script>
<script>
  // If already logged in, redirect to dashboard
  if (sessionStorage.getItem('se_admin_session')) {
    window.location.href = 'dashboard.html';
  }

  document.getElementById('login-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('login-btn');
    const error = document.getElementById('login-error');

    btn.textContent = 'Signing in...';
    btn.disabled = true;

    setTimeout(() => {
      if (login(username, password)) {
        window.location.href = 'dashboard.html';
      } else {
        error.classList.add('show');
        btn.textContent = 'Sign In →';
        btn.disabled = false;
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    }, 400);
  });

  // Hide error on input
  document.querySelectorAll('.form-input').forEach(input => {
    input.addEventListener('input', () => {
      document.getElementById('login-error').classList.remove('show');
    });
  });
</script>
</body>
</html>
