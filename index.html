<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2d8f55" />
    <meta name="description" content="Explore Shillong's top attractions, waterfalls, and tour packages. Book guided tours to Cherrapunji, Dawki, Living Root Bridges and more." />
    <meta name="keywords" content="Shillong tours, Meghalaya travel, Cherrapunji tour, Dawki boat ride, Living Root Bridges, travel agency" />
    <meta property="og:title" content="Sawaiom Travels Agency" />
    <meta property="og:description" content="Discover the Scotland of the East with curated Shillong and Meghalaya experiences." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sawaiom Travels Agency" />
    <meta name="twitter:description" content="Explore Shillong and Meghalaya with guided tours and personalized travel plans." />
    <title>Sawaiom Travels Agency — Discover the Scotland of the East</title>

    <!--
      📚 REACT CONCEPT: Single HTML File (SPA)
      Unlike the old site that had index.html, attractions.html, tours.html etc.,
      a React SPA has ONE index.html. React Router handles all navigation inside
      the browser — the HTML file only loads once, and React swaps components
      in/out of the #root div based on the URL.
    -->
  </head>
  <body>
    <div id="root">
      <!--
        React mounts the entire app here.
        ReactDOM.createRoot(document.getElementById('root')).render(<App />)
        in src/main.jsx injects everything into this div.
      -->
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
